name: Validate 3MF native access ACLs
on:
  push:
    branches: [validation/3mf-native-access-acls-20261120]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'Afloat16/CLI-Anything'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26-intel]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8439b8d5d1dd6a18eb9ed694b9e85c496db2b70f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install harness and test dependencies
        run: |
          python -m pip install -e "./3MF/agent-harness[dev]" networkx
          python -c 'import sys, numpy, scipy, trimesh, pytest; print(sys.version); print(numpy.__version__, scipy.__version__, trimesh.__version__, pytest.__version__)'
      - name: Reproduce native named ACL loss on the preceding PR head
        run: |
          mkdir -p validation-results
          python - <<'PY'
          import pathlib, subprocess, sys, xml.etree.ElementTree as ET
          path = pathlib.Path("3MF/agent-harness/cli_anything/threemf/core/parser.py")
          fixed = path.read_bytes()
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == "8439b8d5d1dd6a18eb9ed694b9e85c496db2b70f"
          system = "windows" if sys.platform == "win32" else "darwin" if sys.platform == "darwin" else "linux"
          path.write_bytes(subprocess.check_output(["git", "show", "0627ffe370d8355b8ed8bbf2edab20493a6b43c3:" + path.as_posix()]))
          try:
              result = subprocess.run([sys.executable, "-m", "pytest", "3MF/agent-harness/cli_anything/threemf/tests/test_access_permissions.py", "-k", f"test_{system}_named_acl_survives_export", "-q", "-ra", "--junitxml=validation-results/acl-baseline.xml"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              pathlib.Path("validation-results/acl-baseline.log").write_text(result.stdout)
              print(result.stdout)
              assert result.returncode == 1, result.returncode
              cases = ET.parse("validation-results/acl-baseline.xml").findall(".//testcase")
              assert len(cases) == 4
              assert sum(case.find("failure") is not None for case in cases) == 4
              assert not any(case.find("error") is not None or case.find("skipped") is not None for case in cases)
          finally:
              path.write_bytes(fixed)
          PY
      - name: Native ACL regression suite without platform skips
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, xml.etree.ElementTree as ET
          system = "windows" if sys.platform == "win32" else "darwin" if sys.platform == "darwin" else "linux"
          result = subprocess.run([sys.executable, "-m", "pytest", "3MF/agent-harness/cli_anything/threemf/tests/test_access_permissions.py", "-k", f"test_{system}_ or test_acl_errors", "-q", "-ra", "--junitxml=validation-results/native-acl.xml"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          pathlib.Path("validation-results/native-acl.log").write_text(result.stdout)
          print(result.stdout)
          assert result.returncode == 0, result.returncode
          cases = ET.parse("validation-results/native-acl.xml").findall(".//testcase")
          assert len(cases) >= 12
          assert not any(case.find("error") is not None or case.find("failure") is not None or case.find("skipped") is not None for case in cases)
          PY
      - name: Original write and close regressions still fail without atomic publication
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, xml.etree.ElementTree as ET
          path = pathlib.Path("3MF/agent-harness/cli_anything/threemf/core/parser.py")
          fixed = path.read_bytes()
          path.write_bytes(subprocess.check_output(["git", "show", "34f519533bc175d2fe287ab8316b0dd99bb9cc43:" + path.as_posix()]))
          try:
              result = subprocess.run([sys.executable, "-m", "pytest", "3MF/agent-harness/cli_anything/threemf/tests/test_atomic_write.py", "-k", "failed_zip", "-q", "-ra", "--junitxml=validation-results/zip-baseline.xml"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              pathlib.Path("validation-results/zip-baseline.log").write_text(result.stdout)
              print(result.stdout)
              assert result.returncode == 1, result.returncode
              cases = ET.parse("validation-results/zip-baseline.xml").findall(".//testcase")
              assert len(cases) == 6
              assert sum(case.find("failure") is not None for case in cases) == 6
          finally:
              path.write_bytes(fixed)
          PY
      - name: Complete affected harness and unchanged tracked source
        run: |
          python -m pytest 3MF/agent-harness/cli_anything/threemf/tests/ -q -ra --junitxml=validation-results/full.xml
          git diff --exit-code
          git diff --check
      - name: Exact source remains unchanged after any failure
        if: always()
        run: git diff --exit-code
