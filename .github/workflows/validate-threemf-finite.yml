name: Verify 3MF finite resize inputs

on:
  push:
    branches: [validation/threemf-nonfinite-diameter-20261119]

permissions:
  contents: read

jobs:
  threemf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 6f6b08881616a42dfeede326ddd1f85cea9274b3
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install harness and geometry test dependencies
        run: python -m pip install -e './3MF/agent-harness[dev]' networkx
      - name: Prove the regression on unchanged upstream code
        working-directory: 3MF/agent-harness
        run: |
          git show 34f519533bc175d2fe287ab8316b0dd99bb9cc43:3MF/agent-harness/cli_anything/threemf/core/modifier.py > cli_anything/threemf/core/modifier.py
          git show 34f519533bc175d2fe287ab8316b0dd99bb9cc43:3MF/agent-harness/cli_anything/threemf/threemf_cli.py > cli_anything/threemf/threemf_cli.py
          set +e
          python -m pytest cli_anything/threemf/tests/test_core.py -k nonfinite_diameter -q
          result=$?
          set -e
          git restore cli_anything/threemf/core/modifier.py cli_anything/threemf/threemf_cli.py
          test "$result" -eq 1
      - name: Run all 3MF tests on fixed source
        working-directory: 3MF/agent-harness
        run: python -m pytest cli_anything/threemf/tests -q
      - name: Check unchanged source and whitespace
        run: |
          test "$(git rev-parse HEAD)" = 6f6b08881616a42dfeede326ddd1f85cea9274b3
          git diff --check HEAD^ HEAD
          git diff --exit-code
