name: libreoffice-empty-table-rows-validation

on:
  push:
    branches: [validation/libreoffice-empty-rows-20261119]

permissions:
  contents: read

jobs:
  full-harness:
    if: github.repository == 'Afloat16/CLI-Anything'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLI_ANYTHING_FORCE_INSTALLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 70372c1e0bb28efc81c9aba578368fab41b4fd26
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = 70372c1e0bb28efc81c9aba578368fab41b4fd26
      - name: Install the harness's native backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress fonts-dejavu-core
          libreoffice --version
      - name: Install the harness and declared test dependencies
        working-directory: libreoffice/agent-harness
        run: python -m pip install -e '.[dev]'
      - name: Validate root skills
        run: python .github/scripts/validate_root_skills.py
      - name: Prove empty rows are lost on the upstream implementation
        shell: bash
        run: |
          git show 34f519533bc175d2fe287ab8316b0dd99bb9cc43:libreoffice/agent-harness/cli_anything/libreoffice/core/importer.py > libreoffice/agent-harness/cli_anything/libreoffice/core/importer.py
          set +e
          python -m pytest libreoffice/agent-harness/cli_anything/libreoffice/tests -q -k 'preserves_empty_table_rows or empty_row_retains_table_width or import_export_preserves_empty_writer_table_rows' > "$RUNNER_TEMP/empty-rows-before.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/empty-rows-before.log"
          test "$status" -eq 1
          grep -F '7 failed' "$RUNNER_TEMP/empty-rows-before.log"
          git restore --source=70372c1e0bb28efc81c9aba578368fab41b4fd26 -- libreoffice/agent-harness/cli_anything/libreoffice/core/importer.py
      - name: Run every unit and end-to-end test with the installed CLI
        run: python -m pytest libreoffice/agent-harness/cli_anything/libreoffice/tests -v
      - name: Check source bytes
        if: always()
        run: git diff --exit-code
